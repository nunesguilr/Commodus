<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commodus – Inteligência para Previsão de Commodities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 2dvh;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
        }

        .input-container {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border-radius: 0.375rem;
            background-color: transparent;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: none;
        }

        #commodity-select {
            flex: 1;
            border: none;
            outline: none;
            padding: 0.5rem;
            color: white;
            font-size: 1rem;
            border-radius: 0.375rem;
            background-color: transparent;
            transition: border-color 0.2s ease;
            box-shadow: none;
        }

        #commodity-select option {
            background-color: #4a5568;
            color: white;
        }

        #prever-button {
            background-color: transparent;
            color: white;
            padding: 0.75rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            box-shadow: none;
        }

        #prever-button:hover {
            transform: translateX(5px);
        }

        .fa-arrow-right {
            margin-left: 0.5rem;
            color: #fff;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            backdrop-filter: blur(6px);
            background: rgba(0, 0, 0, 0.6);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-spinner {
            width: 64px;
            height: 64px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 1rem;
            font-size: 1.2rem;
            color: #e0e0e0;
            animation: pulse 1.8s infinite;
            text-align: center;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-white p-8 flex justify-center items-center h-screen">
    <div class="container mx-auto p-8 bg-gray-800 rounded-lg shadow-md text-center">
        <img src="/static/logo-g.svg" alt="Logo da Empresa" class="logo mx-auto">
        <h1 class="text-3xl font-semibold text-blue-500 mb-6"><strong>Commodus</strong></h1>
        <div class="mb-6">
            <div class="input-container">
                <select id="commodity-select" required
                    class="w-full py-3 px-4 text-white leading-tight focus:outline-none bg-gray-700">
                    <option value="" disabled selected>Selecione a Commodity:</option>
                    {% for commodity in commodities %}
                    <option value="{{ commodity }}" class="bg-gray-700 text-white">{{ commodity }}</option>
                    {% endfor %}
                </select>
                <button id="prever-button"
                    class="inline-block px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-full hover:bg-blue-700 transition duration-300">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <div id="loading-overlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">
                <i class="fas fa-robot text-blue-400 mr-2"></i>Gerando previsão com IA...
            </div>
        </div>
    </div>

    <script>
        document.getElementById('prever-button').addEventListener('click', function () {
            var commoditySelect = document.getElementById('commodity-select');
            var selectedCommodity = commoditySelect.value;

            if (selectedCommodity) {
                document.getElementById('loading-overlay').style.display = 'flex';

                setTimeout(function () {
                    window.location.href = '/previsao/' + selectedCommodity;
                }, 1500);
            } else {
                alert('Por favor, selecione uma commodity.');
            }
        });
    </script>
</body>

</html>
